[project]
name = "headhunter-mcp-server"
version = "0.1.0"
description = "A security-hardened MCP server for the HeadHunter API"
requires-python = ">=3.10,<3.14"
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "keyring>=25.0.0,<26.0.0",
    "mcp>=1.0.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
